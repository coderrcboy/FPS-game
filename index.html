<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Pistol Duel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="menu">
    <h1>Retro Pistol Duel</h1>

    <div class="mode-select">
      <label>
        <input type="radio" name="game-mode" value="bot" id="radio-bot" checked> Vs Bot
      </label>
      <label>
        <input type="radio" name="game-mode" value="2player" id="radio-2p"> 2 Player (Local)
      </label>
    </div>

    <br>

    <div id="diff-section">
      <button id="btn-easy">Easy</button>
      <button id="btn-medium">Medium</button>
      <button id="btn-hard">Hard</button>
    </div>

    <div id="p2-section" style="display: none;">
      <button id="btn-start-2p">Start 2 Player Game</button>
    </div>

    <div class="settings-box">
      <h3>Settings</h3>
      <div class="setting-item">
        <label for="volume-slider">Volume: </label>
        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
      </div>

      <div class="setting-item">
        <label>Theme Era:</label>
        <div class="era-container">
          <input type="range" id="era-slider" min="0" max="2" step="1" value="0">
          <div class="era-labels">
            <span>Retro</span>
            <span>Caveman</span>
            <span>Futuristic</span>
          </div>
        </div>
      </div>
    </div>

    <div class="rules-box">
      <h3>How to Play</h3>
      <p><b>P1:</b> WASD / Arrows to Move | Mouse to Aim & Click to Shoot (or Space)</p>
      <p><b>P2 (2 Player Mode):</b> Arrow Keys to Move | Enter or Right-Shift to Shoot</p>
      <p>Bullets ricochet off walls! Headshots deal extra damage.</p>
    </div>

    <p id="result-text"></p>
  </main>

  <canvas id="game" width="1200" height="700"></canvas>

  <section id="hud">
    <button id="btn-pause">Pause</button>
    <button id="btn-back">Back</button>
  </section>

  <section id="pause-screen">
    <h2>Paused</h2>
    <button id="btn-resume">Resume</button>
    <button id="btn-quit">Quit</button>
  </section>

  <script src="game.js"></script>
</body>
</html>
