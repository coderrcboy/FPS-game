<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Pistol Duel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="menu">
    <h1>Retro Pistol Duel</h1>

    <button id="btn-easy">Easy</button>
    <button id="btn-medium">Medium</button>
    <button id="btn-hard">Hard</button>

    <p id="result-text"></p>
  </main>

  <canvas id="game" width="1200" height="700"></canvas>

  <section id="hud">
    <button id="btn-pause">Pause</button>
    <button id="btn-back">Back</button>
  </section>

  <section id="pause-screen">
    <h2>Paused</h2>
    <button id="btn-resume">Resume</button>
    <button id="btn-quit">Quit</button>
  </section>

  <script src="game.js"></script>
</body>
</html>
